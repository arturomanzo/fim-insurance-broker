name: Lighthouse Audit

on:
  schedule:
    # Ogni domenica alle 8:00 — audit automatico settimanale
    - cron: '0 8 * * 0'
  workflow_dispatch:
    # Eseguibile manualmente dalla tab Actions di GitHub

jobs:
  lighthouse:
    name: Lighthouse CI — Audit performance sito live
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      # Pagine, numero di giri e soglie stanno in lighthouserc.json (radice del repo).
      # Fino al 01/11/2026 l'assert usava il preset lighthouse:recommended con
      # continue-on-error: decine di voci rosse ogni settimana e job comunque
      # verde, così nessuno ha visto per mesi il bottone principale sotto il
      # contrasto minimo (#225). Ora poche soglie, e il job diventa rosso quando
      # una pagina che porta contatti scende sotto: GitHub manda la mail.
      # La performance resta un avviso: sui runner di GitHub oscilla di 10-30 punti.
      - name: Run Lighthouse su pagine che portano contatti
        run: lhci collect

      - name: Assert soglie (accessibilità, SEO, best practice; performance solo avviso)
        run: lhci assert

      - name: Upload report come artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report-${{ github.run_number }}
          # lhci collect salva i report (lhr-*.html e .json) in .lighthouseci/, che
          # è una cartella nascosta: senza include-hidden-files l'upload la salta
          # e l'artifact non veniva mai creato.
          path: .lighthouseci/
          include-hidden-files: true
          retention-days: 30
