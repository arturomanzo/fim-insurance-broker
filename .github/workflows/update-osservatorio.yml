name: Aggiorna Osservatorio Prezzi (AI)

on:
  # SCHEDULE DISINNESCATO IL 24/08/2026 — non rimetterlo senza leggere qui.
  #
  # Questo job non aggiorna niente: `scripts/update-osservatorio.ts` non
  # recupera dati da nessuna fonte, i sei premi medi sono costanti scritte nel
  # sorgente e sono identici a quelli gia' pubblicati. Facendolo girare
  # cambierebbe solo l'etichetta del trimestre e farebbe riscrivere all'IA i
  # commenti attorno agli stessi identici numeri: una PR che sembra un
  # aggiornamento e non lo e'.
  #
  # Era programmato per il 1 gennaio/aprile/luglio/ottobre alle 8:00 e non e'
  # mai partito (il file stava fuori dalla .github/workflows della root fino al
  # 10/08/2026), quindi il primo scatto vero sarebbe stato il 1 ottobre 2026.
  #
  # Per riattivarlo servono numeri veri — dai preventivi del gestionale o da
  # una fonte pubblica — e va aggiornata anche la `methodology` in
  # `lib/osservatorio-data.ts`, che e' quella che dichiara al cliente da dove
  # vengono i dati.
  #
  # schedule:
  #   - cron: '0 8 1 1,4,7,10 *'

  # Esecuzione manuale dal tab Actions
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Trimestre (es. Q2 2025)'
        required: false
        default: ''

jobs:
  update-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: fim-broker-website/package-lock.json

      - name: Install dependencies
        working-directory: fim-broker-website
        run: npm ci

      - name: Genera report aggiornato con Claude AI
        working-directory: fim-broker-website
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          QUARTER_OVERRIDE: ${{ github.event.inputs.quarter }}
        run: npx tsx scripts/update-osservatorio.ts

      - name: Commit e PR
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'feat(osservatorio): aggiorna report prezzi assicurativi trimestrale'
          title: '📊 Osservatorio Prezzi — Aggiornamento trimestrale automatico'
          body: |
            ## Aggiornamento automatico Osservatorio Prezzi

            Generato dall'azione GitHub `update-osservatorio.yml`, eseguita a mano.

            ⚠️ **Da controllare prima di mergiare.** Lo script non recupera dati da
            nessuna fonte: i premi medi sono costanti scritte in
            `scripts/update-osservatorio.ts`. Se non sono stati sostituiti con
            numeri veri, questo PR cambia solo l'etichetta del trimestre e i
            commenti generati dall'IA, lasciando i premi identici a prima.

            Cambiando i dati va aggiornata anche la `methodology` in
            `lib/osservatorio-data.ts`: è quella che dichiara al cliente da dove
            vengono i numeri.
          branch: osservatorio/aggiornamento-trimestrale
          delete-branch: true
          labels: |
            osservatorio
            automated
